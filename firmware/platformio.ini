; ============================================================
;  BNO08x IMU → WiFi/TCP 推送 固件
;  硬件: FireBeetle 2 ESP32-S3 (4MB Flash) + GY-BNO08x
;
;  编译/烧录:
;    pio run -e imu_left  -t upload   ; 左手 (AP=EMG_IMU_LEFT,  port 8766)
;    pio run -e imu_right -t upload   ; 右手 (AP=EMG_IMU_RIGHT, port 8767)
; ============================================================

[platformio]
default_envs = imu_left

; ---- 公共配置 (两手共用) ----
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 这块板子实际 Flash 4MB (devkitc-1 默认 8MB 会启动崩溃: spi_flash assert)
board_build.partitions = default.csv
board_upload.flash_size = 4MB

monitor_speed = 115200

; BNO08x 库 (WiFi.h 是 Arduino-ESP32 自带, 无需额外依赖)
lib_deps =
    adafruit/Adafruit BNO08x

; USB-C 走原生 USB CDC (本地调试看 Serial 输出用; 数据走 WiFi/TCP 不走 USB)
;
; WiFi STA 凭据不在这里传 (Windows 下 -D 传字符串宏, 引号会被 shell 吃掉, 实测失败).
; 直接改 firmware_imu/src/main.cpp 顶部的 WIFI_SSID / WIFI_PASS 两行 (左右手共用).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- 左手 ----
[env:imu_left]
build_flags =
    ${env.build_flags}
    -DPOSITION_LEFT=1

; ---- 右手 ----
[env:imu_right]
build_flags =
    ${env.build_flags}
    -DPOSITION_RIGHT=1

; ============================================================
;  AP fallback 变体 (无路由器/离线调试, 切回已验证的纯 AP 单手流程)
;  用法:  pio run -e imu_left_ap  -t upload
;         pio run -e imu_right_ap -t upload
;  注意: 默认的 imu_left / imu_right 是 STA 模式; 这两个 _ap 才是 AP.
; ============================================================
[env:imu_left_ap]
extends = imu_left
build_flags =
    ${env:imu_left.build_flags}
    -DUSE_WIFI_AP=1

[env:imu_right_ap]
extends = imu_right
build_flags =
    ${env:imu_right.build_flags}
    -DUSE_WIFI_AP=1
